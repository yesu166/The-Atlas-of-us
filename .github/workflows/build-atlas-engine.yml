name: Build C++ WebAssembly engine
# Keep the checked-in runtime binary in sync with source-level movement and jump tuning.

on:
  push:
    branches: [main]
    paths:
      - "src/three/atlas_engine.cpp"
      - ".github/workflows/build-atlas-engine.yml"
  pull_request:
    paths:
      - "src/three/atlas_engine.cpp"
      - ".github/workflows/build-atlas-engine.yml"

permissions:
  contents: write

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build browser game
        run: |
          npm install --no-package-lock
          npm run build

      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Compile optimized WebAssembly
        run: |
          mkdir -p public/engine
          clang++ src/three/atlas_engine.cpp \
            --target=wasm32-unknown-unknown \
            -O3 -nostdlib -ffreestanding -fno-exceptions -fno-rtti \
            -Wl,--no-entry \
            -Wl,--export=atlas_engine_abi_version \
            -Wl,--export=atlas_buffer \
            -Wl,--export=atlas_step \
            -Wl,--export=atlas_interactable_buffer \
            -Wl,--export=atlas_interactable_capacity \
            -Wl,--export=atlas_set_interactable_count \
            -Wl,--export=atlas_region_at \
            -Wl,--export=atlas_find_nearest \
            -Wl,--export-memory \
            -Wl,--initial-memory=131072 \
            -Wl,--max-memory=131072 \
            -Wl,--strip-all \
            -o public/engine/atlas-engine.wasm

      - name: Smoke-test module and movement
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const bytes = fs.readFileSync("public/engine/atlas-engine.wasm");
          const module = new WebAssembly.Module(bytes);
          const names = WebAssembly.Module.exports(module).map((item) => item.name);
          for (const name of ["memory", "atlas_engine_abi_version", "atlas_buffer", "atlas_step", "atlas_interactable_buffer", "atlas_interactable_capacity", "atlas_set_interactable_count", "atlas_region_at", "atlas_find_nearest"]) {
            if (!names.includes(name)) throw new Error("Missing Wasm export: " + name);
          }
          const imports = WebAssembly.Module.imports(module);
          if (imports.length !== 0) {
            throw new Error("C++ engine should be self-contained; unexpected imports: " + JSON.stringify(imports));
          }
          const instance = new WebAssembly.Instance(module, {});
          if (instance.exports.atlas_engine_abi_version() !== 1) throw new Error("Unexpected Atlas engine ABI version");
          const ptr = instance.exports.atlas_buffer();
          const state = new Float32Array(instance.exports.memory.buffer, ptr, 32);
          state[0] = 0; state[1] = -0.02; state[2] = 8.2;
          state[3] = 0; state[4] = 0; state[5] = 0; state[6] = 1;
          state[7] = Math.PI; state[8] = 0; state[9] = 1; state[10] = Math.PI;
          state[11] = 1 / 60; state[12] = 2.7; state[13] = 0;
          state[14] = 0; state[15] = 0; state[16] = 0;
          for (let frame = 0; frame < 60; frame++) {
            state[16] = frame / 60;
            instance.exports.atlas_step(ptr);
          }
          if (![state[0], state[1], state[2], state[3], state[4], state[7]].every(Number.isFinite)) {
            throw new Error("Engine produced non-finite movement state");
          }
          if (state[2] >= 8.2) throw new Error("Forward-input smoke test did not move");
          if (instance.exports.atlas_region_at(state[2]) !== 0) throw new Error("Region query returned the wrong chapter");
          const interactPtr = instance.exports.atlas_interactable_buffer();
          const capacity = instance.exports.atlas_interactable_capacity();
          if (capacity < 1) throw new Error("Interactable buffer has no capacity");
          const items = new Float32Array(instance.exports.memory.buffer, interactPtr, capacity * 5);
          items.set([state[0], 0.48, state[2], 2, 0], 0);
          instance.exports.atlas_set_interactable_count(1);
          const nearest = instance.exports.atlas_find_nearest(state[0], 0.48, state[2], 0);
          if (nearest !== 0) throw new Error("Native proximity query failed: " + nearest);
          if (instance.exports.atlas_find_nearest(state[0], 0.48, state[2], 1) !== -1) throw new Error("Proximity query ignored region filtering");
          state[8] = 0; state[9] = 0; state[13] = 1; state[14] = 0; state[15] = 0;
          instance.exports.atlas_step(ptr);
          if (state[22] !== 0) throw new Error("Single-call simulation did not return the nearest interaction: " + state[22]);
          // Direct-ground jump and buffered jump acceptance.
          state[0] = 0; state[1] = -0.02; state[2] = 4.0;
          state[3] = 0; state[4] = 0; state[5] = 0; state[6] = 1; state[7] = Math.PI;
          state[8] = 0; state[9] = 0; state[10] = Math.PI; state[11] = 1/60;
          state[12] = 2.7; state[13] = 0; state[14] = 0; state[15] = 1; state[16] = 0;
          state[23] = 0; state[24] = 0;
          instance.exports.atlas_step(ptr);
          if (state[6] > .5 || state[1] <= -0.02 || state[5] <= 0) throw new Error("Ground jump did not launch upward");
          // An airborne tap remains buffered until the next grounded frame.
          state[1] = 0.7; state[5] = 0; state[6] = 0; state[15] = 1; state[23] = 0; state[24] = 0;
          instance.exports.atlas_step(ptr);
          if (state[23] <= 0) throw new Error("Jump input was not buffered");
          state[1] = -0.02; state[5] = 0; state[6] = 1; state[15] = 0; state[11] = 1/60;
          instance.exports.atlas_step(ptr);
          if (state[6] > .5 || state[5] <= 0) throw new Error("Buffered jump did not launch after landing");
          // The meadow clamps lateral movement at its edge.
          state.fill(0);
          state[0] = 41.95; state[1] = -0.02; state[2] = 4.0;
          state[6] = 1; state[7] = 0; state[8] = 1; state[10] = 0;
          state[11] = 0.05; state[12] = 4.25; state[13] = 0;
          for (let frame = 0; frame < 20; frame++) { state[16] = frame * 0.05; instance.exports.atlas_step(ptr); }
          if (state[0] > 42.001) throw new Error("Player escaped the meadow X boundary: " + state[0]);
          // The workshop wall must block horizontal motion without trapping the player.
          state.fill(0);
          state[0] = -11.0; state[1] = -0.02; state[2] = -18.0;
          state[6] = 1; state[7] = 0; state[8] = 1; state[10] = 0;
          state[11] = 0.05; state[12] = 4.25; state[13] = 0;
          for (let frame = 0; frame < 60; frame++) { state[16] = frame * 0.05; instance.exports.atlas_step(ptr); }
          if (state[0] > -10.25) throw new Error("Player crossed the workshop collision wall: " + state[0]);
          // Story regions guide objectives but are not invisible movement gates.
          // The only expected stop in the final region is the actual house rear wall.
          state.fill(0);
          state[0] = 0; state[1] = -0.02; state[2] = -105.0;
          state[6] = 1; state[7] = Math.PI; state[9] = 1; state[10] = Math.PI;
          state[11] = 0.05; state[12] = 4.25; state[13] = 0;
          for (let frame = 0; frame < 120; frame++) { state[16] = frame * 0.05; instance.exports.atlas_step(ptr); }
          if (state[2] > -115.0 || state[2] < -119.5) throw new Error("Unexpected final-region traversal clamp: " + state[2]);
          if (instance.exports.atlas_region_at(state[2]) !== 5) throw new Error("Final meadow region was not reachable");
          console.log("WASM engine OK:", bytes.length, "bytes; no imports; movement, world bounds, collision wall, open traversal, region, proximity and buffered-jump checks passed.");
          NODE

      - name: Commit the built module on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/engine/atlas-engine.wasm
          if git diff --cached --quiet; then
            echo "Compiled module is already up to date."
            exit 0
          fi
          git commit -m "Build optimized WebAssembly engine"
          git push
